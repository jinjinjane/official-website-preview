<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jovida - Most AI powers work. We power health.</title>
    <link rel="icon" type="image/png+xml" href="/img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @import url("https://fonts.googleapis.com/css?family=Urbanist:300,900,800,400,600");
      @font-face {
        font-family: "SF Pro-Semibold";
        src: url("/fonts/sf-pro-semibold.ttf") format("truetype");
        font-display: swap;
      }

      @font-face {
        font-family: "SF Pro-Bold";
        src: url("/fonts/sf-pro-bold.otf") format("opentype");
        font-display: swap;
      }

      @font-face {
        font-family: "SF Pro-Medium";
        src: url("/fonts/sf-pro-medium.ttf") format("truetype");
        font-display: swap;
      }

      @font-face {
        font-family: "SF Pro-Regular";
        src: url("/fonts/sf-pro-regular.ttf") format("truetype");
        font-display: swap;
      }
    </style>
    <style>
      @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
      * {
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0px;
        height: 100%;
      }
      /* a blue color as a generic focus style */
      button:focus-visible {
        outline: 2px solid #4a90e2 !important;
        outline: -webkit-focus-ring-color auto 5px !important;
      }
      a {
        text-decoration: none;
      }
    </style>
    <link href="styleguide.css" rel="stylesheet" />
  </head>

    <div id="app"></div>
