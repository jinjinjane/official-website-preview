variables:
  APP: $CI_PROJECT_NAMESPACE
  SERVER: $CI_PROJECT_NAME
  VERSION: $CI_COMMIT_SHA
  IMAGE_TAG_PROD: ${CI_COMMIT_TAG}-${CI_COMMIT_SHORT_SHA}
  IMAGE_TAG_DEV: dev-${CI_COMMIT_BRANCH}${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}-${CI_COMMIT_SHORT_SHA}
  IMAGE_US_EAST: sea-registry.us-east-1.cr.aliyuncs.com/${CI_PROJECT_PATH}
  IMAGE_SGP: sea-registry.ap-southeast-1.cr.aliyuncs.com/${CI_PROJECT_PATH}

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TITLE == "edit by devops"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TITLE == "add by devops"
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG =~ /^release-.*/
    - if: $CI_COMMIT_BRANCH

default:
  tags: [shell]
  before_script:
    - echo "CI_PROJECT_PATH ${CI_PROJECT_PATH}"
    - echo "CI_COMMIT_BRANCH ${CI_COMMIT_BRANCH}"
    - echo "CI_COMMIT_TAG ${CI_COMMIT_TAG}"
    - echo "CI_COMMIT_SHA ${CI_COMMIT_SHA}"
    - echo "IMAGE_TAG_DEV ${IMAGE_TAG_DEV}"
    - echo "IMAGE_US_EAST ${IMAGE_US_EAST}"
    - echo "IMAGE_SGP ${IMAGE_SGP}"
    - export NODE_VERSION=18
    - node --version
    - npm --version

# https://docs.gitlab.com/ee/ci/pipelines/pipeline_architectures.html
stages:
  - lint
  - image
  - deploy

lint:
  stage: lint
  script:
    - npm ci
    - npm run build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/


image-push-sgp-dev:
  stage: image
  script:
    - docker build -f "${CI_PROJECT_DIR}/Dockerfile" -t ${IMAGE_SGP}:${IMAGE_TAG_DEV} ${CI_PROJECT_DIR}
    - docker push ${IMAGE_SGP}:${IMAGE_TAG_DEV}
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release-.*/ && $CI_COMMIT_TITLE =~ /.*image-push.*/
    - when: manual
      allow_failure: true

image-push-us-prod:
  stage: image
  script:
    - docker build -f "${CI_PROJECT_DIR}/Dockerfile" -t ${IMAGE_US_EAST}:${IMAGE_TAG_DEV} ${CI_PROJECT_DIR}
    - docker push ${IMAGE_US_EAST}:${IMAGE_TAG_DEV}
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-.*/
    - when: manual
      allow_failure: true

